<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>GBC Porting</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <section id="auth-loading" class="gate-view">
      <span class="gate-status">Checking session</span>
    </section>

    <section id="login-view" class="gate-view" hidden>
      <h1>GBC Porting</h1>
      <a id="login-link" class="primary-link" href="/auth/login">Login</a>
    </section>

    <section id="visitor-view" class="gate-view" hidden>
      <h1>GBC Porting</h1>
      <span id="visitor-account" class="gate-status"></span>
      <button id="request-access" class="primary" type="button">Request user access</button>
      <span id="access-request-status" class="gate-status"></span>
      <button id="visitor-logout" type="button">Logout</button>
    </section>

    <div id="app-view" hidden>
    <main>
      <section class="rom-toolbar" aria-label="ROM selection">
        <div class="rom-toolbar-player rom-toolbar-player-one">
          <select id="rom-select" aria-label="Player 1 ROM"></select>
          <button id="load-rom" class="primary" type="button">Load</button>
          <div class="app-menu">
            <button
              id="menu-toggle"
              class="menu-toggle"
              type="button"
              aria-label="Account menu"
              aria-controls="app-menu-panel"
              aria-expanded="false"
              title="Account menu"
            >&#9776;</button>
            <div id="app-menu-panel" class="menu-panel" aria-label="Account and save actions" hidden>
            <div id="account-name" class="account-name"></div>
            <div id="rom-meta" class="meta menu-meta"></div>
            <a class="source-link menu-command" href="/core/VisualBoyAdvance-src-1.7.2.zip">Core source</a>
            <label class="file-button menu-command superadmin-only" for="rom-upload">Upload ROM</label>
            <input id="rom-upload" type="file" accept=".gba,.gb,.gbc" hidden />
            <button id="refresh-roms" class="menu-command" type="button">Refresh</button>
            <button id="local-2p-toggle" class="menu-command" type="button">2P</button>

            <div class="menu-section">
              <span class="menu-label">Quick state</span>
              <div id="quick-state-meta" class="meta block">No account state</div>
              <div class="action-grid menu-save-actions save-admin-only">
                <button id="export-state" type="button" disabled>Export .sg1</button>
                <label class="file-button disabled" id="import-state-label" for="import-state">Import .sg1</label>
                <input id="import-state" type="file" accept=".sg1,.sgm,application/gzip" hidden disabled />
              </div>
            </div>

            <div class="menu-section">
              <span class="menu-label">Battery save</span>
              <div id="battery-meta" class="meta block">No account battery save</div>
              <div class="action-grid menu-save-actions save-admin-only">
                <button id="export-battery" type="button" disabled>Export .sa1</button>
                <label class="file-button disabled" id="import-battery-label" for="import-battery">Import .sa1</label>
                <input id="import-battery" type="file" accept=".sa1,.sav" hidden disabled />
              </div>
            </div>

            <button id="logout" class="menu-command" type="button">Logout</button>
            </div>
          </div>
        </div>
        <div id="player2-toolbar" class="rom-toolbar-player rom-toolbar-player-two" hidden>
          <select id="player2-rom-select" aria-label="Player 2 ROM"></select>
          <button id="player2-load" class="primary" type="button">Load</button>
          <span id="player2-account" class="meta player2-identity">Player 2</span>
          <button id="player2-logout" type="button" hidden>Logout P2</button>
        </div>
      </section>

      <section id="local-2p-bar" class="local-2p-bar" hidden aria-label="Local two player controls">
        <span id="local-2p-status" class="status idle">Player 2 setup</span>
        <button id="local-exit" class="danger" type="button">Exit 2P</button>
      </section>

      <section id="workspace" class="workspace">
        <div id="player-one-panel" class="player-column player-panel" data-player="1">
          <div id="player1-runtime"></div>
        </div>

        <div id="player-two-panel" class="player-column player-panel player-two-panel" data-player="2" hidden>
          <div id="player2-choice" class="player2-choice">
            <button id="player2-login" class="primary" type="button">Login</button>
            <button id="player2-guest" type="button">Continue as guest</button>
            <button id="player2-close" type="button">Close</button>
            <span id="player2-auth-status" class="meta" aria-live="polite"></span>
          </div>

          <div id="player2-visitor" class="player2-choice" hidden>
            <span id="player2-visitor-status" class="meta">Player 2 needs user access</span>
            <button id="player2-request-access" class="primary" type="button">Request user access</button>
            <button id="player2-visitor-back" type="button">Use another account</button>
          </div>

          <div id="player2-runtime" hidden></div>
        </div>

        <aside id="save-column" class="save-column">
          <section class="save-section link-section">
            <div class="section-heading">
              <h2>Link Cable</h2>
              <span id="link-socket-status" class="link-socket-status">Offline</span>
            </div>
            <div id="link-lobby" class="link-lobby">
              <button id="link-create" class="primary" type="button" disabled>Create room</button>
              <input id="link-room-input" type="text" inputmode="text" autocomplete="off" placeholder="Room ID" aria-label="Room ID" />
              <input id="link-invite-input" type="text" inputmode="text" autocomplete="off" placeholder="PW" aria-label="Room PW" />
              <button id="link-join" type="button" disabled>Join</button>
            </div>
            <div id="link-room" class="link-room" hidden>
              <dl class="link-details">
                <div class="copy-detail">
                  <dt>Room</dt>
                  <dd id="link-room-id" class="copy-value" role="button" tabindex="0" aria-label="Copy room ID"></dd>
                  <span id="link-room-copy-feedback" class="copy-feedback" aria-live="polite"></span>
                </div>
                <div id="link-invite-row" class="copy-detail" hidden>
                  <dt>PW</dt>
                  <dd id="link-invite-code" class="copy-value" role="button" tabindex="0" aria-label="Copy room PW"></dd>
                  <span id="link-pw-copy-feedback" class="copy-feedback" aria-live="polite"></span>
                </div>
                <div><dt>Status</dt><dd id="link-room-status"></dd></div>
              </dl>
              <ol id="link-participants" class="link-participants"></ol>
              <div class="action-grid link-actions">
                <button id="link-ready" type="button">Ready</button>
                <button id="link-start" class="primary" type="button">Start</button>
                <button id="link-finish" class="primary" type="button">Finish + save</button>
                <button id="link-abort" class="danger" type="button">Leave room</button>
                <button id="link-close" type="button" hidden>Close</button>
              </div>
            </div>
          </section>

          <section class="save-section superadmin-only">
            <h2>Reference Saves</h2>
            <div id="fixture-list" class="fixture-list"></div>
          </section>

          <section class="save-section log-section">
            <h2>Session</h2>
            <ol id="event-log" class="event-log"></ol>
          </section>
        </aside>
      </section>
    </main>
    </div>

    <template id="player-runtime-template">
      <div class="player-runtime" data-player-runtime>
        <div class="screen-shell" data-runtime-role="screen-shell">
          <canvas width="240" height="160" data-runtime-role="screen"></canvas>
          <div class="screen-empty" data-runtime-role="screen-empty">Select ROM</div>
        </div>
        <div class="playback-bar">
          <button type="button" data-runtime-role="pause" disabled>Pause</button>
          <button type="button" data-runtime-role="mute" disabled>Mute</button>
          <button type="button" data-runtime-role="fullscreen" disabled>Fullscreen</button>
          <span class="status idle" data-runtime-role="status">Idle</span>
        </div>
        <div class="touch-controls" data-runtime-role="touch-controls">
          <div class="dpad">
            <button data-button="64" class="up direction">▲</button>
            <button data-button="32" class="left direction">◀</button>
            <button data-button="16" class="right direction">▶</button>
            <button data-button="128" class="down direction">▼</button>
          </div>
          <div class="center-controls">
            <div class="system-controls">
              <button data-button="4">Select</button>
              <button data-button="8">Start</button>
            </div>
            <div class="quick-controls">
              <button type="button" data-runtime-role="quick-save" disabled>Quick Save</button>
              <button type="button" data-runtime-role="quick-load" disabled>Quick Load</button>
            </div>
          </div>
          <div class="action-controls">
            <button class="speed-toggle" type="button" aria-pressed="false"
              data-runtime-role="speed" disabled>Speed off</button>
            <div class="face-buttons">
              <button data-button="2" class="round">B</button>
              <button data-button="1" class="round accent">A</button>
            </div>
            <div class="shoulder-buttons">
              <button data-button="512">L</button>
              <button data-button="256">R</button>
            </div>
          </div>
        </div>
        <div class="keymap" data-runtime-role="keymap"></div>
        <div class="local-link-actions" data-runtime-role="local-actions">
          <button type="button" data-runtime-role="ready" disabled>Ready</button>
          <button class="primary" type="button" data-runtime-role="cable-start" disabled>Start</button>
        </div>
      </div>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
